name: Deploy to AWS S3 + CloudFront

on: 
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Instala dependencias
      - name: Install dependencies
        run: npm install

      # 4. Build React app
      - name: Build React app
        run: npm run build

      # 5. Configura AWS credencials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 6. Deploy a S3
      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://fer-portfolio-bucket --delete

      # 7. Invalidate CloudFront cache
      - name: Invalidate CloudFront cache                                           
        run: |
          aws cloudfront create-invalidation --distribution-id E2J2LW9NUYS87L --paths "/*"

      # 8. Success message
      - name: Deployment successful
        run: echo "Deployment to AWS S3 and CloudFront successful!"